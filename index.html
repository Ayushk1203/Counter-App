<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter App</title>
    <link rel="Stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <h1>Counter App</h1>
    <div class="container">
        <input type="number" id="result" placeholder="0">
        <div class="inc-dec-buttons">
            <button id="inc">+</button>
            <button id="dec">-</button>
        </div>
        <div class="custom-inc-dec">
            <span>Increment/Decrement By : </span>
            <input type="number" id="cus-inc-dec" placeholder="0">
        </div>
        <button class="reset" id="r">Reset</button>
    </div>
    
</body>
</html>
